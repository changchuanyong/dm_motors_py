[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dm-motors"
version = "0.1.0"
description = "Python SDK for Damiao motors through the official USB2CAN adapter"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = ["numpy>=2.0.1", "pyserial>=3.5"]

[tool.setuptools.packages.find]
include = ["motor*"]
